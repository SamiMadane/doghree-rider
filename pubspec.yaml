name: doghree_rider
description: A new Flutter application.
publish_to: 'none' #
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  firebase_auth: ^6.0.0
  flutter_local_notifications: ^19.4.0
  path_provider: ^2.1.4
  url_strategy: ^0.3.0
  pin_code_fields: ^8.0.1
  http: ^1.2.2
  flutter_switch: ^0.3.2
  shimmer_animation: ^2.2.1
  geolocator: ^14.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  vector_map_tiles: ^8.0.0       
  vector_map_tiles_pmtiles: ^1.5.0
  url_launcher: ^6.3.0
  vibration: ^3.1.3
  image_picker: ^1.1.2
  country_code_picker: ^3.0.0
  audioplayers: ^6.1.0
  flutter_widget_from_html_core: ^0.17.0
  cached_network_image: ^3.4.1
  path: ^1.9.0
  http_parser: ^4.1.0
  intl: ^0.20.2
  dotted_border: ^3.1.0
  photo_view: ^0.15.0
  web_socket_channel: ^3.0.1
  flutter_inappwebview: ^6.0.0
  just_the_tooltip: ^0.0.12
  flutter_svg: ^2.0.10+1
  permission_handler: ^12.0.1
  flutter_foreground_task: ^9.1.0
  dropdown_button2: ^2.3.9
  open_filex: ^4.7.0
  flutter_native_splash: ^2.4.6
  smooth_page_indicator: ^1.2.1
  dotted_line: ^3.2.3
  phone_numbers_parser: ^9.0.3
  lottie: ^3.3.1
  camera: ^0.11.2
  syncfusion_flutter_gauges: ^30.2.7
  flutter_screenutil: ^5.9.3
  flutter_launcher_icons: ^0.14.4
  image_cropper: ^11.0.0
  maplibre_gl: ^0.27.1



dependency_overrides:
  collection: ^1.19.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo_1024_square.png"
  remove_alpha_ios: true
  background_color_ios: "#FFC233"
  adaptive_icon_background: "#FFC233"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/animations/
    - assets/language/
    - assets/icon/
    - assets/lottie/
    - assets/map/
    - assets/notification.mp3

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900
    - family: Tajawal
      fonts:
        - asset: assets/font/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/font/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/font/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/font/Tajawal-Black.ttf
          weight: 900     